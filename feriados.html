<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Feriados e Emendas (v1.2 Nuvem)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #1b5e20;
            --secondary-color: #e8f5e9;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #d0d0d0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-200 pb-20">

    <div class="container space-y-6">
        <!-- CABEÇALHO -->
        <div class="flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
            <a href="index.html" class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold transition hover:bg-gray-200">⬅️ Voltar ao Menu</a>
            <h2 class="text-lg font-black uppercase text-green-800 dark:text-green-400">🍃 Feriados e Emendas</h2>
            <button onclick="sincronizarFeriados()" class="bg-green-100 dark:bg-green-950 text-green-800 dark:text-green-300 px-3 py-1.5 rounded-xl text-xs font-bold transition">🔄 Sincronizar</button>
        </div>

        <!-- SELETOR DE ANO PARA GERAR FERIADOS AUTOMÁTICOS -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex items-center justify-between gap-3">
            <div>
                <h3 class="text-xs font-bold uppercase text-green-800 dark:text-green-400">📅 Ano de Referência para Feriados Nacionais</h3>
                <p class="text-[11px] text-gray-500">Gera automaticamente os feriados fixos e móveis para o ano selecionado.</p>
            </div>
            <div class="flex items-center gap-2">
                <input type="number" id="inputAnoFeriados" value="2026" onchange="gerarFeriadosNacionaisAno(this.value)" class="w-20 text-xs p-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold text-center">
            </div>
        </div>

        <!-- FORMULÁRIO DE CADASTRO DE FERIADO/EMENDA LOCAL -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-4">
            <h3 class="text-xs font-bold uppercase text-green-800 dark:text-green-400">✨ Registar Feriado Local ou Emenda por Data</h3>
            
            <input type="hidden" id="editId" value="">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Data do Evento</label>
                    <input type="date" id="feriadoData" class="w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Tipo de Registo</label>
                    <select id="feriadoTipo" class="w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                        <option value="feriado">🍃 Feriado (Nacional / Municipal / Estadual)</option>
                        <option value="emenda">📌 Emenda / Ponto Facultativo</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Descrição / Nome</label>
                <input type="text" id="feriadoDesc" placeholder="EX: ANIVERSÁRIO DA CIDADE / EMENDA NATAL..." class="uppercase w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="salvarFeriadoCustom()" class="flex-1 bg-green-700 hover:bg-green-800 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">✓ Guardar Registo (OK)</button>
                <button onclick="limparFormulario()" class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2.5 rounded-xl text-xs font-bold">Limpar</button>
            </div>
        </div>

        <!-- LISTA DE FERIADOS E EMENDAS -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-3">
            <h3 class="text-xs font-bold uppercase text-gray-700 dark:text-gray-300">📋 Feriados Nacionais Automáticos e Registos Customizados</h3>
            <div id="listaFeriadosContainer" class="space-y-2 max-h-96 overflow-y-auto pr-1">
                <!-- Preenchido dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jmeepzdvmmjngxwvayqb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_54ORrLbP7naW7n-KlKCdUA_hZnpjguH';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const CHAVE_LOCAL_FERIADOS = "modulo_feriados_dados_nuvem";

        function calcularPascoa(ano) {
            let a = ano % 19,
                b = Math.floor(ano / 100),
                c = ano % 100,
                d = Math.floor(b / 4),
                e = b % 4,
                f = Math.floor((b + 8) / 25),
                g = Math.floor((b - f + 1) / 3),
                h = (19 * a + b - d - g + 15) % 30,
                i = Math.floor(c / 4),
                k = c % 4,
                L = (32 + 2 * e + 2 * i - h - k) % 7,
                m = Math.floor((a + 11 * h + 22 * L) / 451),
                mes = Math.floor((h + L - 7 * m + 114) / 31),
                dia = ((h + L - 7 * m + 114) % 31) + 1;
            return new Date(ano, mes - 1, dia);
        }

        function formatarDataISO(date) {
            let y = date.getFullYear();
            let m = String(date.getMonth() + 1).padStart(2, '0');
            let d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function obterFeriadosFixosEMoveis(ano) {
            let pascoa = calcularPascoa(ano);
            let carnaval = new Date(pascoa);
            carnaval.setDate(pascoa.getDate() - 47);
            let paixao = new Date(pascoa);
            paixao.setDate(pascoa.getDate() - 2);
            let corpus = new Date(pascoa);
            corpus.setDate(pascoa.getDate() + 60);

            return [
                { id: `fn_${ano}_1`, data: `${ano}-01-01`, tipo: 'feriado', desc: 'CONFRATERNIZAÇÃO UNIVERSAL' },
                { id: `fn_${ano}_2`, data: formatarDataISO(carnaval), tipo: 'feriado', desc: 'CARNAVAL' },
                { id: `fn_${ano}_3`, data: formatarDataISO(new Date(carnaval.getTime() + 86400000)), tipo: 'feriado', desc: 'CARNAVAL (TERÇA)' },
                { id: `fn_${ano}_4`, data: formatarDataISO(paixao), tipo: 'feriado', desc: 'PAIXÃO DE CRISTO' },
                { id: `fn_${ano}_5`, data: `${ano}-04-21`, tipo: 'feriado', desc: 'TIRADENTES' },
                { id: `fn_${ano}_6`, data: `${ano}-05-01`, tipo: 'feriado', desc: 'DIA DO TRABALHO' },
                { id: `fn_${ano}_7`, data: formatarDataISO(corpus), tipo: 'feriado', desc: 'CORPUS CHRISTI' },
                { id: `fn_${ano}_8`, data: `${ano}-09-07`, tipo: 'feriado', desc: 'INDEPENDÊNCIA DO BRASIL' },
                { id: `fn_${ano}_9`, data: `${ano}-10-12`, tipo: 'feriado', desc: 'N. SRA. APARECIDA' },
                { id: `fn_${ano}_10`, data: `${ano}-11-02`, tipo: 'feriado', desc: 'FINADOS' },
                { id: `fn_${ano}_11`, data: `${ano}-11-15`, tipo: 'feriado', desc: 'PROCLAMAÇÃO DA REPÚBLICA' },
                { id: `fn_${ano}_12`, data: `${ano}-11-20`, tipo: 'feriado', desc: 'CONSCIÊNCIA NEGRA' },
                { id: `fn_${ano}_13`, data: `${ano}-12-25`, tipo: 'feriado', desc: 'NATAL' }
            ];
        }

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('feriadoData').valueAsDate = new Date();
            await sincronizarFeriados();
        });

        async function sincronizarFeriados() {
            try {
                let { data } = await supabaseClient
                    .from('app_dados_programacao')
                    .select('conteudo')
                    .eq('id', '1')
                    .single();

                let salvas = (data && data.conteudo && data.conteudo.feriados) ? data.conteudo.feriados : [];
                let anoAtual = new Date().getFullYear();
                verificarEGarantirAno(salvas, anoAtual);
                verificarEGarantirAno(salvas, anoAtual + 1);

                localStorage.setItem(CHAVE_LOCAL_FERIADOS, JSON.stringify(salvas));
            } catch (e) {
                console.error("Erro ao sincronizar feriados:", e);
                let salvas = JSON.parse(localStorage.getItem(CHAVE_LOCAL_FERIADOS)) || obterFeriadosFixosEMoveis(new Date().getFullYear());
                localStorage.setItem(CHAVE_LOCAL_FERIADOS, JSON.stringify(salvas));
            }
            renderizarListaFeriados();
        }

        function verificarEGarantirAno(lista, ano) {
            let idsAno = lista.map(l => l.id);
            let gerados = obterFeriadosFixosEMoveis(ano);
            gerados.forEach(g => {
                if (!idsAno.includes(g.id)) {
                    lista.push(g);
                }
            });
        }

        async function gerarFeriadosNacionaisAno(anoStr) {
            let ano = parseInt(anoStr);
            if (isNaN(ano) || ano < 2000 || ano > 2100) return;

            let feriados = obterFeriados();
            verificarEGarantirAno(feriados, ano);
            
            feriados.sort((a, b) => new Date(a.data) - new Date(b.data));
            localStorage.setItem(CHAVE_LOCAL_FERIADOS, JSON.stringify(feriados));
            await salvarNaNuvemGeral(feriados);
            renderizarListaFeriados();
            alert(`✅ Feriados nacionais gerados e sincronizados para o ano ${ano}!`);
        }

        async function salvarNaNuvemGeral(novosFeriados) {
            try {
                let { data } = await supabaseClient.from('app_dados_programacao').select('conteudo').eq('id', '1').single();
                let conteudo = data ? (data.conteudo || {}) : {};
                conteudo.feriados = novosFeriados;

                await supabaseClient
                    .from('app_dados_programacao')
                    .upsert({ id: '1', conteudo: conteudo });
            } catch (err) {
                console.error("Erro ao salvar feriados na nuvem:", err);
            }
        }

        function obterFeriados() {
            let dados = JSON.parse(localStorage.getItem(CHAVE_LOCAL_FERIADOS));
            if (!dados) {
                dados = obterFeriadosFixosEMoveis(new Date().getFullYear());
                localStorage.setItem(CHAVE_LOCAL_FERIADOS, JSON.stringify(dados));
            }
            return dados;
        }

        async function salvarFeriadoCustom() {
            const data = document.getElementById('feriadoData').value;
            const tipo = document.getElementById('feriadoTipo').value;
            const desc = document.getElementById('feriadoDesc').value.trim().toUpperCase();
            const editId = document.getElementById('editId').value;

            if (!data || !desc) {
                alert("Por favor, preencha a data e a descrição.");
                return;
            }

            let feriados = obterFeriados();
            const itemObj = {
                id: editId !== "" ? editId : 'feriado_custom_' + Date.now(),
                data, tipo, desc
            };

            if (editId !== "") {
                const index = feriados.findIndex(f => f.id === editId);
                if (index !== -1) {
                    feriados[index] = itemObj;
                }
                document.getElementById('editId').value = "";
            } else {
                feriados.push(itemObj);
            }

            feriados.sort((a, b) => new Date(a.data) - new Date(b.data));

            localStorage.setItem(CHAVE_LOCAL_FERIADOS, JSON.stringify(feriados));
            await salvarNaNuvemGeral(feriados);

            limparFormulario();
            renderizarListaFeriados();
            alert("✅ Registo guardado e sincronizado com sucesso!");
        }

        // Função para enviar o feriado/emenda explicitamente para a programação semanal ao clicar em OK
        async function enviarFeriadoParaProgramacao(id) {
            let feriados = obterFeriados();
            let f = feriados.find(item => item.id === id);
            if (!f) return;

            try {
                let { data } = await supabaseClient.from('app_dados_programacao').select('conteudo').eq('id', '1').single();
                let conteudo = data ? (data.conteudo || {}) : {};
                if (!conteudo.semanas) conteudo.semanas = {};

                // Calcula o ano e a semana da data do feriado
                const dObj = new Date(f.data + 'T00:00:00');
                const ano = dObj.getFullYear();
                
                const d = new Date(Date.UTC(dObj.getFullYear(), dObj.getMonth(), dObj.getDate()));
                const dayNum = d.getUTCDay() || 7; 
                d.setUTCDate(d.getUTCDate() + 4 - dayNum);
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                const semanaNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);

                const semanaKey = `prog_grid_${ano}_semana_${semanaNo}`;

                // Cria esqueleto padrão se a semana não existir na nuvem
                if (!conteudo.semanas[semanaKey]) {
                    conteudo.semanas[semanaKey] = `
                        <div class="day-card" data-dia-idx="1" data-dia-nome="Segunda"><div class="day-content"><div class="day-title">Segunda</div><div class="tasks-container space-y-1"></div></div><div class="day-resources"><div class="resources-title">Recursos</div></div></div>
                        <div class="day-card" data-dia-idx="2" data-dia-nome="Terça"><div class="day-content"><div class="day-title">Terça</div><div class="tasks-container space-y-1"></div></div><div class="day-resources"><div class="resources-title">Recursos</div></div></div>
                        <div class="day-card" data-dia-idx="3" data-dia-nome="Quarta"><div class="day-content"><div class="day-title">Quarta</div><div class="tasks-container space-y-1"></div></div><div class="day-resources"><div class="resources-title">Recursos</div></div></div>
                        <div class="day-card" data-dia-idx="4" data-dia-nome="Quinta"><div class="day-content"><div class="day-title">Quinta</div><div class="tasks-container space-y-1"></div></div><div class="day-resources"><div class="resources-title">Recursos</div></div></div>
                        <div class="day-card" data-dia-idx="5" data-dia-nome="Sexta"><div class="day-content"><div class="day-title">Sexta</div><div class="tasks-container space-y-1"></div></div><div class="day-resources"><div class="resources-title">Recursos</div></div></div>
                    `;
                }

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = conteudo.semanas[semanaKey];

                const diasMap = { 1: "Segunda", 2: "Terça", 3: "Quarta", 4: "Quinta", 5: "Sexta" };
                const diaSemanaNum = dObj.getDay();

                if (diaSemanaNum >= 1 && diaSemanaNum <= 5) {
                    const nomeDia = diasMap[diaSemanaNum];
                    const cardDia = tempDiv.querySelector(`.day-card[data-dia-nome="${nomeDia}"]`);
                    
                    if (cardDia) {
                        const tasksCont = cardDia.querySelector('.tasks-container');
                        const tituloFeriado = f.tipo === 'feriado' ? '🍃 FERIADO' : '📌 EMENDA';

                        tasksCont.innerHTML = `
                            <div style="background-color: ${f.tipo === 'feriado' ? '#e8f5e9' : '#e0f2f1'}; border: 1px solid #a3e4d7; border-left: 4px solid ${f.tipo === 'feriado' ? '#2e7d32' : '#00897b'}; border-radius: 6px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;" class="p-4 text-center shadow-sm">
                                <span style="color: ${f.tipo === 'feriado' ? '#1b5e20' : '#004d40'}; font-weight: 900; font-size: 13px;">${tituloFeriado}</span>
                                <div style="color: ${f.tipo === 'feriado' ? '#2e7d32' : '#00695c'}; font-size: 10px; font-weight: 700; margin-top: 4px;">${f.desc}</div>
                                <button onclick="removerElemento(this)" class="mt-2 bg-red-100 text-red-700 px-2 py-0.5 rounded text-[9px] font-bold">Remover Bloqueio</button>
                            </div>
                        `;
                        cardDia.querySelector('.day-resources').innerHTML = '';

                        conteudo.semanas[semanaKey] = tempDiv.innerHTML;

                        await supabaseClient
                            .from('app_dados_programacao')
                            .upsert({ id: '1', conteudo: conteudo });

                        alert(`✅ ${f.desc} enviado com sucesso para a Semana ${semanaNo} (${ano})!`);
                    }
                } else {
                    alert("⚠️ A data deste evento cai num fim de semana (Sábado/Domingo).");
                }

            } catch (err) {
                console.error("Erro ao enviar feriado para programação:", err);
                alert("❌ Erro ao enviar para a programação.");
            }
        }

        function limparFormulario() {
            document.getElementById('feriadoData').valueAsDate = new Date();
            document.getElementById('feriadoDesc').value = '';
            document.getElementById('editId').value = '';
        }

        function renderizarListaFeriados() {
            const container = document.getElementById('listaFeriadosContainer');
            container.innerHTML = '';
            let feriados = obterFeriados();

            if (feriados.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-4">Nenhum feriado ou emenda registado.</p>';
                return;
            }

            feriados.forEach((f) => {
                const isNacional = f.id.startsWith('fn_');
                const icone = f.tipo === 'feriado' ? '🍃' : '📌';
                const corBadge = f.tipo === 'feriado' ? 'text-emerald-800 dark:text-emerald-300' : 'text-amber-800 dark:text-amber-300';
                
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-gray-50 dark:bg-gray-900 p-3 rounded-xl border border-gray-200 dark:border-gray-700 text-xs gap-2';
                div.innerHTML = `
                    <div>
                        <span class="font-bold ${corBadge} block text-sm">${icone} ${f.desc}</span>
                        <small class="text-gray-500 font-semibold">Data: ${f.data.split('-').reverse().join('/')} ${isNacional ? '• (Nacional Automático)' : '• (Customizado)'}</small>
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick="enviarFeriadoParaProgramacao('${f.id}')" class="bg-green-700 hover:bg-green-800 text-white px-2.5 py-1 rounded-lg font-bold shadow-sm" title="Enviar para a Programação Semanal">✅ OK (Enviar)</button>
                        <button onclick="editarFeriado('${f.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded-lg font-bold">Editar</button>
                        <button onclick="apagarFeriado('${f.id}')" class="bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 px-2.5 py-1 rounded-lg font-bold">Apagar</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function editarFeriado(id) {
            let feriados = obterFeriados();
            let f = feriados.find(item => item.id === id);
            if (f) {
                document.getElementById('feriadoData').value = f.data;
                document.getElementById('feriadoTipo').value = f.tipo;
                document.getElementById('feriadoDesc').value = f.desc;
                document.getElementById('editId').value = f.id;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function apagarFeriado(id) {
            if (confirm("Tem certeza que deseja apagar este registo?")) {
                let feriados = obterFeriados();
                feriados = feriados.filter(item => item.id !== id);
                localStorage.setItem(CHAVE_LOCAL_FERIADOS, JSON.stringify(feriados));
                await salvarNaNuvemGeral(feriados);
                renderizarListaFeriados();
            }
        }
    </script>
</body>
</html>
