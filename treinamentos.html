<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Treinamentos (v2.0 Nuvem Pro)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #1b5e20;
            --secondary-color: #e8f5e9;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #d0d0d0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-200 pb-20">

    <div class="container space-y-5">
        <!-- CABEÇALHO -->
        <div class="flex flex-wrap justify-between items-center gap-2 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
            <a href="index.html" class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold transition hover:bg-gray-200">⬅️ Voltar ao Menu</a>
            <div class="text-center">
                <h2 class="text-lg font-black uppercase text-green-800 dark:text-green-400">🎓 Gestão de Treinamentos</h2>
                <span class="text-[10px] font-bold text-gray-400">Controle e envio manual para a programação</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="alternarDarkMode()" class="px-2.5 py-1.5 rounded-xl bg-gray-100 dark:bg-gray-700 text-xs font-bold transition">🌙/☀️ Tema</button>
                <button onclick="sincronizarTreinamentos()" class="bg-green-100 dark:bg-green-950 text-green-800 dark:text-green-300 px-3 py-1.5 rounded-xl text-xs font-bold transition">🔄 Sincronizar</button>
            </div>
        </div>

        <!-- RESUMO OPERACIONAL RÁPIDO -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 text-center">
                <span class="text-[10px] font-bold uppercase text-gray-500">Total Registado</span>
                <h3 id="contadorTotal" class="text-xl font-black text-green-700 dark:text-green-400">0</h3>
            </div>
            <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 text-center">
                <span class="text-[10px] font-bold uppercase text-blue-600">📅 Próximos / Ativos</span>
                <h3 id="contadorProximos" class="text-xl font-black text-blue-600 dark:text-blue-400">0</h3>
            </div>
            <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 text-center">
                <span class="text-[10px] font-bold uppercase text-gray-400">Concluídos (Passados)</span>
                <h3 id="contadorPassados" class="text-xl font-black text-gray-500">0</h3>
            </div>
        </div>

        <!-- FORMULÁRIO DE CADASTRO / EDIÇÃO -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-4">
            <h3 class="text-xs font-bold uppercase text-green-800 dark:text-green-400">✨ Registar ou Editar Treinamento</h3>
            
            <input type="hidden" id="editId" value="">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Data de Início</label>
                    <input type="date" id="treinamentoInicio" class="w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Data de Fim</label>
                    <input type="date" id="treinamentoFim" class="w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Nome do Treinamento</label>
                    <input type="text" id="treinamentoNome" list="sugestoesCursos" placeholder="Ex: NR-10..." class="uppercase w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                    <datalist id="sugestoesCursos">
                        <option value="NR-10 SEGURANÇA EM INSTALAÇÕES ELÉTRICAS">
                        <option value="NR-12 SEGURANÇA NO TRABALHO EM MÁQUINAS">
                        <option value="NR-33 ESPAÇO CONFINADO">
                        <option value="NR-35 TRABALHO EM ALTURA">
                        <option value="DIREÇÃO DEFENSIVA">
                        <option value="OPERAÇÃO DE EMPILHADEIRA">
                        <option value="BRIGADA DE INCÊNDIO">
                        <option value="PRIMEIROS SOCORROS">
                        <option value="RAC 01 - TRABALHO EM ALTURA">
                        <option value="RAC 02 - VEÍCULOS AUTOMOTORES">
                        <option value="RAC 03 - EQUIPAMENTOS MÓVEIS">
                    </datalist>
                </div>
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Local</label>
                    <input type="text" id="treinamentoLocal" list="sugestoesLocais" placeholder="Ex: SALA DE TREINAMENTO..." class="uppercase w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                    <datalist id="sugestoesLocais">
                        <option value="SALA DE TREINAMENTO">
                        <option value="SALA DE AUDIÊNCIAS">
                        <option value="ALMOXARIFADO CENTRAL">
                        <option value="G4">
                        <option value="OFICINA MECÂNICA">
                        <option value="AUDITÓRIO">
                        <option value="ONLINE / TEAMS">
                    </datalist>
                </div>
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Nome da Pessoa</label>
                    <input type="text" id="treinamentoPessoa" placeholder="Ex: MARIANA..." class="uppercase w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="salvarTreinamento()" class="flex-1 bg-green-700 hover:bg-green-800 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">💾 Guardar Treinamento</button>
                <button onclick="limparFormulario()" class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2.5 rounded-xl text-xs font-bold">Limpar</button>
            </div>
        </div>

        <!-- BARRA DE BUSCA, FILTROS E EXPORTAÇÃO -->
        <div class="bg-white dark:bg-gray-800 p-3.5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <!-- BUSCA EM TEMPO REAL -->
                <div class="flex-1 min-w-[220px]">
                    <input type="text" id="inputBuscaTreino" oninput="filtrarTreinamentos()" placeholder="🔍 Buscar por pessoa, curso ou local..." class="w-full text-xs p-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-xl dark:text-white">
                </div>
                <!-- FILTRO DE PERÍODO -->
                <div class="flex items-center gap-1 text-xs font-bold">
                    <button type="button" onclick="mudarFiltroStatus('todos')" id="btnFiltroTodos" class="btn-filtro px-2.5 py-1.5 rounded-lg bg-green-700 text-white shadow-xs">Todos</button>
                    <button type="button" onclick="mudarFiltroStatus('proximos')" id="btnFiltroProximos" class="btn-filtro px-2.5 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200">Próximos</button>
                    <button type="button" onclick="mudarFiltroStatus('passados')" id="btnFiltroPassados" class="btn-filtro px-2.5 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200">Passados</button>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-1 border-t dark:border-gray-700">
                <button onclick="exportarTreinamentosCSV()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition shadow-sm flex items-center gap-1">
                    📊 Exportar CSV
                </button>
                <button onclick="imprimirTreinamentos()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm transition flex items-center gap-1">
                    🖨️ Imprimir PDF
                </button>
            </div>
        </div>

        <!-- LISTA DE TREINAMENTOS CADASTRADOS -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-3">
            <h3 class="text-xs font-bold uppercase text-gray-700 dark:text-gray-300">📋 Treinamentos Registados</h3>
            <div id="listaTreinamentos" class="space-y-2">
                <!-- Preenchido dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jmeepzdvmmjngxwvayqb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_54ORrLbP7naW7n-KlKCdUA_hZnpjguH';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const CHAVE_LOCAL_TREINOS = "modulo_treinamentos_dados_nuvem";
        let filtroStatusAtual = 'todos';

        function alternarDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('dark_mode', document.documentElement.classList.contains('dark'));
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (localStorage.getItem('dark_mode') === 'true') {
                document.documentElement.classList.add('dark');
            }
            document.getElementById('treinamentoInicio').valueAsDate = new Date();
            document.getElementById('treinamentoFim').valueAsDate = new Date();
            await sincronizarTreinamentos();
        });

        async function sincronizarTreinamentos() {
            try {
                let { data, error } = await supabaseClient
                    .from('app_dados_programacao')
                    .select('conteudo')
                    .eq('id', '1')
                    .single();

                if (data && data.conteudo && data.conteudo.treinamentos) {
                    localStorage.setItem(CHAVE_LOCAL_TREINOS, JSON.stringify(data.conteudo.treinamentos));
                }
            } catch (e) {
                console.error("Erro ao sincronizar treinamentos:", e);
            }
            renderizarListaTreinamentos();
        }

        async function salvarNaNuvemGeral(novosTreinamentos) {
            try {
                let { data } = await supabaseClient.from('app_dados_programacao').select('conteudo').eq('id', '1').single();
                let conteudo = data ? (data.conteudo || {}) : {};
                conteudo.treinamentos = novosTreinamentos;

                await supabaseClient
                    .from('app_dados_programacao')
                    .upsert({ id: '1', conteudo: conteudo });
            } catch (err) {
                console.error("Erro ao salvar na nuvem:", err);
            }
        }

        function obterTreinamentos() {
            return JSON.parse(localStorage.getItem(CHAVE_LOCAL_TREINOS)) || [];
        }

        async function salvarTreinamento() {
            const inicio = document.getElementById('treinamentoInicio').value;
            const fim = document.getElementById('treinamentoFim').value;
            const nome = document.getElementById('treinamentoNome').value.trim().toUpperCase();
            const local = document.getElementById('treinamentoLocal').value.trim().toUpperCase();
            const pessoa = document.getElementById('treinamentoPessoa').value.trim().toUpperCase();
            const editId = document.getElementById('editId').value;

            if (!inicio || !fim || !nome || !local || !pessoa) {
                alert("Por favor, preencha todos os campos do treinamento.");
                return;
            }

            if (new Date(inicio) > new Date(fim)) {
                alert("A data de início não pode ser posterior à data de fim.");
                return;
            }

            let treinamentos = obterTreinamentos();
            const itemObj = {
                id: editId !== "" ? editId : 'treino_' + Date.now(),
                inicio, fim, nome, local, pessoa
            };

            if (editId !== "") {
                const index = treinamentos.findIndex(t => t.id === editId);
                if (index !== -1) {
                    treinamentos[index] = itemObj;
                }
                document.getElementById('editId').value = "";
            } else {
                treinamentos.push(itemObj);
            }

            localStorage.setItem(CHAVE_LOCAL_TREINOS, JSON.stringify(treinamentos));
            await salvarNaNuvemGeral(treinamentos);

            limparFormulario();
            renderizarListaTreinamentos();
            alert("✅ Treinamento guardado na base de dados! Para colocá-lo na grade da semana, clique em '✅ OK (Enviar)' no card dele.");
        }

        function limparFormulario() {
            document.getElementById('treinamentoInicio').valueAsDate = new Date();
            document.getElementById('treinamentoFim').valueAsDate = new Date();
            document.getElementById('treinamentoNome').value = '';
            document.getElementById('treinamentoLocal').value = '';
            document.getElementById('treinamentoPessoa').value = '';
            document.getElementById('editId').value = '';
        }

        // ENVIO MANUAL EXCLUSIVO AO CLICAR EM "OK" (INJETADO COM CHECKBOX E BOTÕES COMPLETOS)
        async function enviarParaProgramacao(id) {
            let treinamentos = obterTreinamentos();
            let t = treinamentos.find(item => item.id === id);
            if (!t) return;

            try {
                let { data } = await supabaseClient.from('app_dados_programacao').select('conteudo').eq('id', '1').single();
                let conteudo = data ? (data.conteudo || {}) : {};
                if (!conteudo.semanas) conteudo.semanas = {};

                const dObj = new Date(t.inicio + 'T00:00:00');
                const ano = dObj.getFullYear();
                
                const d = new Date(Date.UTC(dObj.getFullYear(), dObj.getMonth(), dObj.getDate()));
                const dayNum = d.getUTCDay() || 7; 
                d.setUTCDate(d.getUTCDate() + 4 - dayNum);
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                const semanaNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);

                const semanaKey = `prog_grid_${ano}_semana_${semanaNo}`;

                // Se a semana ainda não tiver estrutura salva na nuvem, monta o esqueleto padrão completo
                if (!conteudo.semanas[semanaKey]) {
                    const baseCard = (dia, idx) => `
                        <div class="day-card" data-dia-idx="${idx}" data-dia-nome="${dia}">
                            <div class="day-title">${dia}<br><small>--/---</small></div>
                            <div class="day-content">
                                <div class="flex items-center justify-between gap-1 mb-2 px-1.5 py-1 bg-emerald-50 dark:bg-emerald-950/40 border rounded-md text-[9px] flex-shrink-0">
                                    <label class="flex items-center gap-0.5 font-bold cursor-pointer text-emerald-800 dark:text-emerald-300">
                                        <input type="checkbox" class="check-concluir-dia w-3 h-3 accent-emerald-600" onchange="alternarConclusaoDia(this)"> ✔️ Dia
                                    </label>
                                    <div class="flex items-center gap-1.5">
                                        <label class="flex items-center gap-0.5 font-bold cursor-pointer text-green-700 dark:text-green-300"><input type="checkbox" class="check-feriado w-3 h-3" onchange="alternarBloqueioDia(this)"> Feriado</label>
                                        <label class="flex items-center gap-0.5 font-bold cursor-pointer text-teal-700 dark:text-teal-300"><input type="checkbox" class="check-emenda w-3 h-3" onchange="alternarBloqueioDia(this)"> Emenda</label>
                                    </div>
                                </div>
                                <div class="tasks-container"></div>
                            </div>
                            <div class="day-resources"><div class="resources-title">Recursos</div></div>
                        </div>
                    `;
                    conteudo.semanas[semanaKey] = baseCard("Segunda", 1) + baseCard("Terça", 2) + baseCard("Quarta", 3) + baseCard("Quinta", 4) + baseCard("Sexta", 5);
                }

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = conteudo.semanas[semanaKey];

                const diasMap = { 1: "Segunda", 2: "Terça", 3: "Quarta", 4: "Quinta", 5: "Sexta" };
                const diaSemanaNum = dObj.getDay();

                if (diaSemanaNum >= 1 && diaSemanaNum <= 5) {
                    const nomeDia = diasMap[diaSemanaNum];
                    const cardDia = tempDiv.querySelector(`.day-card[data-dia-nome="${nomeDia}"]`);
                    
                    if (cardDia) {
                        const tasksCont = cardDia.querySelector('.tasks-container');
                        const identificadorUnico = `treino_id_${t.id}`;

                        if (!tasksCont.innerHTML.includes(identificadorUnico)) {
                            const divTreino = document.createElement('div');
                            divTreino.className = 'treinamento-box';
                            divTreino.setAttribute('draggable', 'true');
                            divTreino.setAttribute('ondragstart', 'iniciarArrasto(event)');
                            divTreino.innerHTML = `
                                <span class="${identificadorUnico} flex items-center gap-1.5">
                                    <input type="checkbox" class="task-check w-3.5 h-3.5 accent-green-700 cursor-pointer" onchange="alternarConclusaoTarefa(this)">
                                    <span class="drag-handle">⠿</span> 🎓 <strong class="item-text">${t.nome}</strong><br><small class="pl-5">📍 ${t.local} | 👤 ${t.pessoa}</small>
                                </span>
                                <span class="item-controls flex gap-1">
                                    <button onclick="editarItem(this)" class="btn-action-item btn-edit-item" title="Editar">✏️</button>
                                    <button onclick="removerElemento(this)" class="btn-action-item btn-delete-item" title="Apagar">✕</button>
                                </span>
                            `;
                            tasksCont.appendChild(divTreino);
                            
                            conteudo.semanas[semanaKey] = tempDiv.innerHTML;

                            await supabaseClient
                                .from('app_dados_programacao')
                                .upsert({ id: '1', conteudo: conteudo });

                            alert(`✅ Treinamento enviado com sucesso para a Semana ${semanaNo} (${ano})! Já com caixinha de marcar presença pronta.`);
                        } else {
                            alert("⚠️ Este treinamento já consta na programação desta semana.");
                        }
                    }
                } else {
                    alert("⚠️ A data de início deste treinamento cai num fim de semana (Sábado/Domingo).");
                }

            } catch (err) {
                console.error("Erro ao enviar treinamento para programação:", err);
                alert("❌ Erro ao enviar para a programação.");
            }
        }

        function mudarFiltroStatus(tipo) {
            filtroStatusAtual = tipo;
            document.querySelectorAll('.btn-filtro').forEach(b => {
                b.className = "btn-filtro px-2.5 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200";
            });
            const btnAtivo = tipo === 'todos' ? 'btnFiltroTodos' : (tipo === 'proximos' ? 'btnFiltroProximos' : 'btnFiltroPassados');
            document.getElementById(btnAtivo).className = "btn-filtro px-2.5 py-1.5 rounded-lg bg-green-700 text-white shadow-xs";
            renderizarListaTreinamentos();
        }

        function filtrarTreinamentos() {
            renderizarListaTreinamentos();
        }

        function renderizarListaTreinamentos() {
            const container = document.getElementById('listaTreinamentos');
            container.innerHTML = '';
            let treinamentos = obterTreinamentos();
            const termoBusca = (document.getElementById('inputBuscaTreino') ? document.getElementById('inputBuscaTreino').value : '').trim().toUpperCase();

            // Atualiza contadores
            const hojeStr = new Date().toISOString().split('T')[0];
            let qtdProximos = 0;
            let qtdPassados = 0;

            treinamentos.forEach(t => {
                if (t.fim >= hojeStr) qtdProximos++;
                else qtdPassados++;
            });

            document.getElementById('contadorTotal').innerText = treinamentos.length;
            document.getElementById('contadorProximos').innerText = qtdProximos;
            document.getElementById('contadorPassados').innerText = qtdPassados;

            // Filtro por termo
            let listaFiltrada = treinamentos.filter(t => {
                const bateBusca = !termoBusca || t.nome.includes(termoBusca) || t.pessoa.includes(termoBusca) || t.local.includes(termoBusca);
                if (!bateBusca) return false;

                if (filtroStatusAtual === 'proximos') return t.fim >= hojeStr;
                if (filtroStatusAtual === 'passados') return t.fim < hojeStr;
                return true;
            });

            if (listaFiltrada.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-4">Nenhum treinamento encontrado com os filtros selecionados.</p>';
                return;
            }

            listaFiltrada.forEach((t) => {
                const ehFuturo = t.fim >= hojeStr;
                const div = document.createElement('div');
                div.className = 'flex flex-col sm:flex-row justify-between items-start sm:items-center bg-gray-50 dark:bg-gray-900 p-3 rounded-xl border border-gray-200 dark:border-gray-700 text-xs gap-2 transition hover:border-green-400';
                div.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-green-800 dark:text-green-300 block text-sm">🎓 ${t.nome}</span>
                            <span class="text-[9.5px] font-bold px-2 py-0.5 rounded-full ${ehFuturo ? 'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300' : 'bg-gray-200 text-gray-700 dark:bg-gray-800 dark:text-gray-400'}">${ehFuturo ? 'Em aberto' : 'Concluído'}</span>
                        </div>
                        <span class="text-gray-600 dark:text-gray-300 font-semibold">📍 Local: ${t.local} | 👤 Participante: ${t.pessoa}</span>
                        <small class="text-gray-400 block mt-0.5">Período: ${t.inicio.split('-').reverse().join('/')} até ${t.fim.split('-').reverse().join('/')}</small>
                    </div>
                    <div class="flex gap-1.5 self-end sm:self-center flex-wrap">
                        <button onclick="enviarParaProgramacao('${t.id}')" class="bg-green-700 hover:bg-green-800 text-white px-2.5 py-1 rounded-lg font-bold shadow-sm" title="Enviar manualmente para a grade da semana">✅ OK (Enviar)</button>
                        <button onclick="duplicarTreinamento('${t.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-1 rounded-lg font-bold" title="Duplicar para outra pessoa">📋 Duplicar</button>
                        <button onclick="editarTreinamento('${t.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded-lg font-bold">Editar</button>
                        <button onclick="apagarTreinamento('${t.id}')" class="bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 px-2 py-1 rounded-lg font-bold">Apagar</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function editarTreinamento(id) {
            let treinamentos = obterTreinamentos();
            let t = treinamentos.find(item => item.id === id);
            if (t) {
                document.getElementById('treinamentoInicio').value = t.inicio;
                document.getElementById('treinamentoFim').value = t.fim;
                document.getElementById('treinamentoNome').value = t.nome;
                document.getElementById('treinamentoLocal').value = t.local;
                document.getElementById('treinamentoPessoa').value = t.pessoa;
                document.getElementById('editId').value = t.id;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function duplicarTreinamento(id) {
            let treinamentos = obterTreinamentos();
            let t = treinamentos.find(item => item.id === id);
            if (t) {
                document.getElementById('treinamentoInicio').value = t.inicio;
                document.getElementById('treinamentoFim').value = t.fim;
                document.getElementById('treinamentoNome').value = t.nome;
                document.getElementById('treinamentoLocal').value = t.local;
                document.getElementById('treinamentoPessoa').value = '';
                document.getElementById('editId').value = '';
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
                document.getElementById('treinamentoPessoa').focus();
                alert("📋 Dados duplicados! Digite o nome do novo participante e clique em 'Guardar Treinamento'.");
            }
        }

        async function apagarTreinamento(id) {
            if (confirm("Tem certeza que deseja apagar este registo de treinamento?")) {
                let treinamentos = obterTreinamentos();
                treinamentos = treinamentos.filter(item => item.id !== id);
                localStorage.setItem(CHAVE_LOCAL_TREINOS, JSON.stringify(treinamentos));
                await salvarNaNuvemGeral(treinamentos);
                renderizarListaTreinamentos();
            }
        }

        function exportarTreinamentosCSV() {
            let treinamentos = obterTreinamentos();
            if (treinamentos.length === 0) {
                alert("Nenhum treinamento para exportar.");
                return;
            }

            let csv = "\uFEFFTREINAMENTO;PARTICIPANTE;LOCAL;DATA_INICIO;DATA_FIM;STATUS\n";
            const hojeStr = new Date().toISOString().split('T')[0];

            treinamentos.forEach(t => {
                let status = t.fim >= hojeStr ? "EM ABERTO" : "CONCLUÍDO";
                csv += `"${t.nome}";"${t.pessoa}";"${t.local}";"${t.inicio.split('-').reverse().join('/')}";"${t.fim.split('-').reverse().join('/')}";"${status}"\n`;
            });

            let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `RELATORIO_TREINAMENTOS.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function imprimirTreinamentos() {
            let treinamentos = obterTreinamentos();
            const janelaImpressao = window.open('', '_blank', 'width=900,height=700');
            
            let htmlItens = '';
            if (treinamentos.length === 0) {
                htmlItens = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #666;">Nenhum treinamento registado.</td></tr>';
            } else {
                treinamentos.forEach(t => {
                    htmlItens += `
                        <tr>
                            <td style="padding: 10px; border-bottom: 1px solid #ddd; font-weight: bold;">${t.nome}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #ddd;">${t.pessoa}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #ddd;">${t.local}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #ddd; text-align: center;">${t.inicio.split('-').reverse().join('/')} até ${t.fim.split('-').reverse().join('/')}</td>
                        </tr>
                    `;
                });
            }

            janelaImpressao.document.write(`
                <!DOCTYPE html>
                <html lang="pt-PT">
                <head>
                    <meta charset="UTF-8">
                    <title>Relatório de Treinamentos</title>
                    <style>
                        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 30px; background: #fff; color: #333; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
                        th { background-color: #1b5e20; color: white; padding: 10px; text-align: left; }
                        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                    </style>
                </head>
                <body>
                    <h2 style="color: #1b5e20; text-transform: uppercase;">Relatório de Treinamentos</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Treinamento</th>
                                <th>Participante</th>
                                <th>Local</th>
                                <th style="text-align: center;">Período</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${htmlItens}
                        </tbody>
                    </table>
                    <script>window.onload = function() { setTimeout(function() { window.print(); }, 500); }<\/script>
                </body>
                </html>
            `);
            janelaImpressao.document.close();
        }
    </script>
</body>
</html>
