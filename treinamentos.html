<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Treinamentos (v1.2 Nuvem)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #1b5e20;
            --secondary-color: #e8f5e9;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #d0d0d0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-200 pb-20">

    <div class="container space-y-6">
        <!-- CABEÇALHO COM BOTÃO DE VOLTAR AO ÍNDICE -->
        <div class="flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
            <a href="index.html" class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold transition hover:bg-gray-200">⬅️ Voltar ao Menu</a>
            <h2 class="text-lg font-black uppercase text-green-800 dark:text-green-400">🎓 Gestão de Treinamentos</h2>
            <button onclick="sincronizarTreinamentos()" class="bg-green-100 dark:bg-green-950 text-green-800 dark:text-green-300 px-3 py-1.5 rounded-xl text-xs font-bold transition">🔄 Sincronizar</button>
        </div>

        <!-- FORMULÁRIO DE CADASTRO / EDIÇÃO -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-4">
            <h3 class="text-xs font-bold uppercase text-green-800 dark:text-green-400">✨ Registar ou Editar Treinamento</h3>
            
            <input type="hidden" id="editId" value="">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Data de Início</label>
                    <input type="date" id="treinamentoInicio" class="w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Data de Fim</label>
                    <input type="date" id="treinamentoFim" class="w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Nome do Treinamento</label>
                    <input type="text" id="treinamentoNome" placeholder="Ex: SEGURANÇA EM MÁQUINAS..." class="uppercase w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Local</label>
                    <input type="text" id="treinamentoLocal" placeholder="Ex: SALA DE AUDIÊNCIAS..." class="uppercase w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold uppercase text-gray-500 mb-1">Nome da Pessoa</label>
                    <input type="text" id="treinamentoPessoa" placeholder="Ex: MARIANA..." class="uppercase w-full text-xs p-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg dark:text-white font-bold">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="salvarTreinamento()" class="flex-1 bg-green-700 hover:bg-green-800 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">✓ Guardar Treinamento (OK)</button>
                <button onclick="limparFormulario()" class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2.5 rounded-xl text-xs font-bold">Limpar</button>
            </div>
        </div>

        <!-- LISTA DE TREINAMENTOS CADASTRADOS -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-3">
            <h3 class="text-xs font-bold uppercase text-gray-700 dark:text-gray-300">📋 Treinamentos Registados</h3>
            <div id="listaTreinamentos" class="space-y-2">
                <!-- Preenchido dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jmeepzdvmmjngxwvayqb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_54ORrLbP7naW7n-KlKCdUA_hZnpjguH';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const CHAVE_LOCAL_TREINOS = "modulo_treinamentos_dados_nuvem";

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('treinamentoInicio').valueAsDate = new Date();
            document.getElementById('treinamentoFim').valueAsDate = new Date();
            await sincronizarTreinamentos();
        });

        async function sincronizarTreinamentos() {
            try {
                let { data, error } = await supabaseClient
                    .from('app_dados_programacao')
                    .select('conteudo')
                    .eq('id', '1')
                    .single();

                if (data && data.conteudo && data.conteudo.treinamentos) {
                    localStorage.setItem(CHAVE_LOCAL_TREINOS, JSON.stringify(data.conteudo.treinamentos));
                }
            } catch (e) {
                console.error("Erro ao sincronizar treinamentos:", e);
            }
            renderizarListaTreinamentos();
        }

        async function salvarNaNuvemGeral(novosTreinamentos) {
            try {
                let { data } = await supabaseClient.from('app_dados_programacao').select('conteudo').eq('id', '1').single();
                let conteudo = data ? (data.conteudo || {}) : {};
                conteudo.treinamentos = novosTreinamentos;

                await supabaseClient
                    .from('app_dados_programacao')
                    .upsert({ id: '1', conteudo: conteudo });
            } catch (err) {
                console.error("Erro ao salvar na nuvem:", err);
            }
        }

        function obterTreinamentos() {
            return JSON.parse(localStorage.getItem(CHAVE_LOCAL_TREINOS)) || [];
        }

        async function salvarTreinamento() {
            const inicio = document.getElementById('treinamentoInicio').value;
            const fim = document.getElementById('treinamentoFim').value;
            const nome = document.getElementById('treinamentoNome').value.trim().toUpperCase();
            const local = document.getElementById('treinamentoLocal').value.trim().toUpperCase();
            const pessoa = document.getElementById('treinamentoPessoa').value.trim().toUpperCase();
            const editId = document.getElementById('editId').value;

            if (!inicio || !fim || !nome || !local || !pessoa) {
                alert("Por favor, preencha todos os campos do treinamento.");
                return;
            }

            if (new Date(inicio) > new Date(fim)) {
                alert("A data de início não pode ser posterior à data de fim.");
                return;
            }

            let treinamentos = obterTreinamentos();
            const itemObj = {
                id: editId !== "" ? editId : 'treino_' + Date.now(),
                inicio, fim, nome, local, pessoa
            };

            if (editId !== "") {
                const index = treinamentos.findIndex(t => t.id === editId);
                if (index !== -1) {
                    treinamentos[index] = itemObj;
                }
                document.getElementById('editId').value = "";
            } else {
                treinamentos.push(itemObj);
            }

            localStorage.setItem(CHAVE_LOCAL_TREINOS, JSON.stringify(treinamentos));
            await salvarNaNuvemGeral(treinamentos);

            limparFormulario();
            renderizarListaTreinamentos();
            alert("✅ Treinamento guardado e sincronizado com sucesso!");
        }

        function limparFormulario() {
            document.getElementById('treinamentoInicio').valueAsDate = new Date();
            document.getElementById('treinamentoFim').valueAsDate = new Date();
            document.getElementById('treinamentoNome').value = '';
            document.getElementById('treinamentoLocal').value = '';
            document.getElementById('treinamentoPessoa').value = '';
            document.getElementById('editId').value = '';
        }

        function renderizarListaTreinamentos() {
            const container = document.getElementById('listaTreinamentos');
            container.innerHTML = '';
            let treinamentos = obterTreinamentos();

            if (treinamentos.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-4">Nenhum treinamento registado.</p>';
                return;
            }

            treinamentos.forEach((t) => {
                const div = document.createElement('div');
                div.className = 'flex flex-col sm:flex-row justify-between items-start sm:items-center bg-gray-50 dark:bg-gray-900 p-3 rounded-xl border border-gray-200 dark:border-gray-700 text-xs gap-2';
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-green-800 dark:text-green-300 block text-sm">🎓 ${t.nome}</span>
                        <span class="text-gray-600 dark:text-gray-300 font-semibold">📍 Local: ${t.local} | 👤 Participante: ${t.pessoa}</span>
                        <small class="text-gray-400 block mt-0.5">Período: ${t.inicio.split('-').reverse().join('/')} até ${t.fim.split('-').reverse().join('/')}</small>
                    </div>
                    <div class="flex gap-1.5 self-end sm:self-center">
                        <button onclick="duplicarTreinamento('${t.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-1 rounded-lg font-bold" title="Duplicar para outra pessoa/data">📋 Duplicar</button>
                        <button onclick="editarTreinamento('${t.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded-lg font-bold">Editar</button>
                        <button onclick="apagarTreinamento('${t.id}')" class="bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 px-2.5 py-1 rounded-lg font-bold">Apagar</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function editarTreinamento(id) {
            let treinamentos = obterTreinamentos();
            let t = treinamentos.find(item => item.id === id);
            if (t) {
                document.getElementById('treinamentoInicio').value = t.inicio;
                document.getElementById('treinamentoFim').value = t.fim;
                document.getElementById('treinamentoNome').value = t.nome;
                document.getElementById('treinamentoLocal').value = t.local;
                document.getElementById('treinamentoPessoa').value = t.pessoa;
                document.getElementById('editId').value = t.id;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function duplicarTreinamento(id) {
            let treinamentos = obterTreinamentos();
            let t = treinamentos.find(item => item.id === id);
            if (t) {
                // Preenche o formulário com os dados do curso/local, mas limpa o ID de edição (criando um novo) e foca na pessoa/data
                document.getElementById('treinamentoInicio').value = t.inicio;
                document.getElementById('treinamentoFim').value = t.fim;
                document.getElementById('treinamentoNome').value = t.nome;
                document.getElementById('treinamentoLocal').value = t.local;
                document.getElementById('treinamentoPessoa').value = ''; // Deixa limpo para colocar o novo nome
                document.getElementById('editId').value = ''; // Novo registo
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
                document.getElementById('treinamentoPessoa').focus();
                alert("📋 Dados duplicados! Altere o nome da pessoa ou as datas e clique em 'Guardar Treinamento'.");
            }
        }

        async function apagarTreinamento(id) {
            if (confirm("Tem certeza que deseja apagar este registo de treinamento?")) {
                let treinamentos = obterTreinamentos();
                treinamentos = treinamentos.filter(item => item.id !== id);
                localStorage.setItem(CHAVE_LOCAL_TREINOS, JSON.stringify(treinamentos));
                await salvarNaNuvemGeral(treinamentos);
                renderizarListaTreinamentos();
            }
        }
    </script>
</body>
</html>
